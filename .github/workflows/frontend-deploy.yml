name: Frontend Deploy

on:
  workflow_dispatch:
    inputs:
      frontend_project:
        description: "Vercel frontend project to deploy"
        required: true
        type: choice
        default: default
        options:
          - default
          - crymbo
          - efficient-frontier
          - ginco
          - ht-digital
          - all

permissions:
  contents: read

jobs:
  deploy:
    name: Build & Deploy ${{ matrix.frontend_project }} to Vercel
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: frontend-deploy-${{ matrix.frontend_project }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        frontend_project: ${{ fromJSON(inputs.frontend_project == 'all' && '["default","crymbo","efficient-frontier","ginco","ht-digital"]' || format('["{0}"]', inputs.frontend_project)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Resolve deploy target
        env:
          FRONTEND_PROJECT: ${{ matrix.frontend_project }}
          VERCEL_PROJECT_ID_DEFAULT: ${{ secrets.VERCEL_PROJECT_ID_DEFAULT || secrets.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_ID_CRYMBO: ${{ secrets.VERCEL_PROJECT_ID_CRYMBO }}
          VERCEL_PROJECT_ID_EFFICIENT_FRONTIER: ${{ secrets.VERCEL_PROJECT_ID_EFFICIENT_FRONTIER }}
          VERCEL_PROJECT_ID_GINCO: ${{ secrets.VERCEL_PROJECT_ID_GINCO }}
          VERCEL_PROJECT_ID_CRINGO: ${{ secrets.VERCEL_PROJECT_ID_CRINGO }}
          VERCEL_PROJECT_ID_HT_DIGITAL: ${{ secrets.VERCEL_PROJECT_ID_HT_DIGITAL }}
        run: |
          set -euo pipefail

          case "$FRONTEND_PROJECT" in
            default)
              next_partner="default"
              project_id="$VERCEL_PROJECT_ID_DEFAULT"
              ;;
            crymbo)
              next_partner="crymbo"
              project_id="$VERCEL_PROJECT_ID_CRYMBO"
              ;;
            efficient-frontier)
              next_partner="efficient-frontier"
              project_id="$VERCEL_PROJECT_ID_EFFICIENT_FRONTIER"
              ;;
            ginco)
              next_partner="ginco"
              project_id="${VERCEL_PROJECT_ID_GINCO:-$VERCEL_PROJECT_ID_CRINGO}"
              ;;
            ht-digital)
              next_partner="ht-digital"
              project_id="$VERCEL_PROJECT_ID_HT_DIGITAL"
              ;;
            *)
              echo "Unknown frontend project: $FRONTEND_PROJECT" >&2
              exit 1
              ;;
          esac

          if [ -z "$project_id" ]; then
            echo "Missing Vercel project id secret for frontend project: $FRONTEND_PROJECT" >&2
            exit 1
          fi

          {
            echo "NEXT_PARTNER=$next_partner"
            echo "VERCEL_PROJECT_ID=$project_id"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
          RPC_URL: ${{ secrets.RPC_URL }}
        run: |
          set -euo pipefail

          if [ -z "$NEXT_PUBLIC_PROJECT_ID" ]; then
            echo "Missing NEXT_PUBLIC_PROJECT_ID secret" >&2
            exit 1
          fi

          if [ -z "$RPC_URL" ]; then
            echo "Missing RPC_URL secret" >&2
            exit 1
          fi

          yarn build

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          npx vercel --prod --yes \
            --build-env NEXT_PARTNER="$NEXT_PARTNER" \
            --build-env NEXT_PUBLIC_PROJECT_ID="$NEXT_PUBLIC_PROJECT_ID" \
            --build-env RPC_URL="$RPC_URL" \
            --env NEXT_PARTNER="$NEXT_PARTNER" \
            --env NEXT_PUBLIC_PROJECT_ID="$NEXT_PUBLIC_PROJECT_ID" \
            --env RPC_URL="$RPC_URL" \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
          RPC_URL: ${{ secrets.RPC_URL }}
